<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create a Raid - MathRaids</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/host.css">
</head>
<body>
  <header class="shell site-header">
    <a class="brand" href="/"><span class="brand-mark">M</span> MathRaids</a>
    <nav class="nav"><a class="btn" href="/join/">Join raid</a></nav>
  </header>

  <main class="shell">
    <section class="card form-card" style="max-width:980px">
      <div class="eyebrow">Host console</div>
      <h1 style="font-size:clamp(2.5rem,7vw,4.5rem)">Create a raid</h1>
      <p>Choose how the raid should play, then configure the maths challenge and boss.</p>

      <form id="create-raid-form">
        <div class="form-row">
          <label>Choose raid mode</label>
          <div class="mode-choice-grid" role="radiogroup" aria-label="Raid mode">
            <label class="mode-choice">
              <input type="radio" name="mode" value="ranked" checked>
              <span class="mode-choice-card">
                <span class="mode-choice-icon" aria-hidden="true">🛡️</span>
                <span class="mode-choice-title">Normal Raid</span>
                <span class="mode-choice-copy">A forgiving group experience with shared raid health and curated encounter settings.</span>
                <span class="mode-choice-tags">
                  <span class="mode-choice-tag">Shared health</span>
                  <span class="mode-choice-tag">No knockouts</span>
                  <span class="mode-choice-tag">Preset boss tuning</span>
                </span>
              </span>
            </label>

            <label class="mode-choice hardcore">
              <input type="radio" name="mode" value="hardcore">
              <span class="mode-choice-card">
                <span class="mode-choice-icon" aria-hidden="true">💀</span>
                <span class="mode-choice-title">Hardcore Raid</span>
                <span class="mode-choice-copy">Every player has their own health. Dodge, heal and stack on Tanks. If the whole group is knocked out, the raid wipes.</span>
                <span class="mode-choice-tags">
                  <span class="mode-choice-tag">Individual HP</span>
                  <span class="mode-choice-tag">Knockouts</span>
                  <span class="mode-choice-tag">Raid wipes</span>
                </span>
              </span>
            </label>

            <label class="mode-choice custom">
              <input type="radio" name="mode" value="custom">
              <span class="mode-choice-card">
                <span class="mode-choice-icon" aria-hidden="true">⚙️</span>
                <span class="mode-choice-title">Custom Raid</span>
                <span class="mode-choice-copy">Uses Normal shared-health rules, but unlocks boss health, aggression, attack power and warning-time controls.</span>
                <span class="mode-choice-tags">
                  <span class="mode-choice-tag">Shared health</span>
                  <span class="mode-choice-tag">Boss tuning</span>
                  <span class="mode-choice-tag">Host controlled</span>
                </span>
              </span>
            </label>
          </div>
        </div>

        <div class="form-row">
          <label for="topic">Maths category</label>
          <select id="topic" name="topic">
            <option value="addition">Addition</option>
            <option value="subtraction">Subtraction</option>
            <option value="multiplication" selected>Multiplication</option>
            <option value="division">Division</option>
            <option value="mixed">Mixed arithmetic</option>
          </select>
        </div>

        <div class="form-row">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty" name="difficulty">
            <option value="1">Level 1 - introductory</option>
            <option value="2" selected>Level 2 - standard</option>
            <option value="3">Level 3 - advanced</option>
            <option value="4">Level 4 - challenge</option>
          </select>
          <div class="form-hint">Everyone uses the same band so the group shares one challenge level.</div>
        </div>

        <div class="form-row">
          <label for="boss">Boss</label>
          <select id="boss" name="boss">
            <option value="numberzilla">Numberzilla - City Under Siege</option>
          </select>
          <div class="form-hint">Published MathRaids bosses appear here automatically.</div>
        </div>

        <div id="create-message" aria-live="polite"></div>
        <button id="create-button" class="btn btn-primary btn-lg" type="submit">Create raid</button>
      </form>
    </section>
  </main>

  <script type="module" src="/js/host.js"></script>
</body>
</html>
