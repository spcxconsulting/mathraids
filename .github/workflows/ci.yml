name: Validate MathRaids

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/raid-room.js
          node --check src/questions.js
          node --check public/js/teacher.js
          node --check public/js/teacher-raid.js
          node --check public/js/join.js
          node --check public/js/game.js
          node --check public/js/phaser-battlefield.js
          node --check public/js/pixel-battlefield.js
          node --check public/js/vector-battlefield.js
      - name: Validate Worker build
        run: npm run check
